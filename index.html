<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supreme Student Council Election</title>
<meta name="description" content="Official student election portal — cast your vote and view live results." />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/carousel.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__brand">
      <div class="seal"><img src="assets/images/logo.png" alt="School logo" /></div>
      <div class="site-header__titles">
        <span class="eyebrow">Official Election Portal</span>
        <h1 id="school-name">Loading…</h1>
      </div>
    </div>
    <nav>
      <a href="dashboard.html">Live Results</a>
    </nav>
  </div>
</header>

<main>

  <section class="carousel">
  <h2 class="carousel__heading">Meet the Candidates</h2>
  <div class="carousel__viewport" id="carousel-viewport"></div>
  <div class="carousel__dots" id="carousel-dots"></div>
</section>

  

  <section class="lookup-card" style="margin-top:20px;">
    <div class="seal"><img src="assets/images/logo.png" alt="School logo" /></div>
    <h2 id="election-title">Supreme Student Council Election</h2>
    <p>Cast your vote using your student number. One vote per student — no password required.</p>
    <a class="btn btn--primary btn--block" href="vote.html">Go to Ballot</a>
    <hr class="stub-divider" />
    <a class="btn btn--ghost btn--block" href="dashboard.html">View Live Results</a>
  </section>
</main>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> Student Supreme Student Council Election System</p>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/carousel.js"></script>
<script>
  document.getElementById("school-name").textContent = ELECTION_CONFIG.schoolName;
  document.getElementById("election-title").textContent = ELECTION_CONFIG.electionTitle;
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
